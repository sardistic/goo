server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html application/javascript text/css application/json;
  gzip_min_length 1024;

  # Phone tilt/shake uses DeviceMotion, which browsers only expose to secure, permitted origins.
  add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Single-file app: always revalidate so deploys show up immediately.
  add_header Cache-Control "no-cache" always;

  location / { try_files $uri $uri/ /index.html; }
}
